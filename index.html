<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Copywriter - Alpha Builders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .active-opt { border-color: #0f172a !important; background-color: #f8fafc !important; color: #0f172a !important; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important; }
        .active-multi { border-color: #0f172a !important; background-color: #f8fafc !important; color: #0f172a !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-white via-slate-50 to-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white">

    <!-- Header Corporativo -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 py-6 text-center shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <div id="homeBtn" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" title="Reiniciar herramienta">
                <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-xl shadow-md">AB</div>
                <div class="text-left">
                    <h1 class="text-lg font-black text-slate-900 leading-tight tracking-tight">Alpha Builders</h1>
                    <p class="text-xs text-slate-500 font-bold tracking-widest uppercase mt-0.5">Asistente Copywriter</p>
                </div>
            </div>
            <span class="text-xs px-3 py-1 bg-slate-100 text-slate-600 font-bold rounded-full border border-slate-200 hidden sm:inline-block tracking-wide">V3.0 ESTABLE</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto w-full px-4 py-8 my-auto">
        
        <!-- Wizard Card -->
        <div id="wizardContainer" class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 sm:p-10 transition-all duration-300">
            
            <div class="mb-8">
                <div class="flex justify-between items-center mb-3">
                    <span id="step-title-indicator" class="text-xs font-black uppercase tracking-wider text-slate-900">Paso 1 de 4</span>
                    <span id="step-percentage" class="text-xs font-bold text-slate-400">25% Completado</span>
                </div>
                <div class="flex justify-between items-center relative">
                    <div class="absolute left-0 right-0 top-1/2 transform -translate-y-1/2 h-1.5 bg-slate-100 rounded-full z-0"></div>
                    <div id="step-indicator-1" class="w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-sm z-10 relative shadow-md transition-all">1</div>
                    <div id="step-indicator-2" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">2</div>
                    <div id="step-indicator-3" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">3</div>
                    <div id="step-indicator-4" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">4</div>
                </div>
            </div>

            <form id="promptForm" class="space-y-6">

                <!-- PASO 1: Contexto de Proyecto -->
                <div class="step-content space-y-6" data-step="1">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Eje de Campaña</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">¿Sobre qué vamos a hablar hoy?</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <button type="button" class="option-btn p-4 border-2 rounded-2xl text-center font-bold text-sm transition-all border-slate-900 bg-slate-50 text-slate-900 active-opt" data-group="promocionando" data-value="Empresa (Corporativo)">🏢 Corporativo</button>
                            <button type="button" class="option-btn p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-group="promocionando" data-value="Pixel">🏢 Pixel</button>
                            <button type="button" class="option-btn p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-group="promocionando" data-value="Magnus">🏢 Magnus</button>
                            <button type="button" class="option-btn p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-group="promocionando" data-value="Imagine">🏢 Imagine</button>
                            <button type="button" class="option-btn p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-group="promocionando" data-value="Proyectos en Desarrollo (Smart, Rubik, Musk, Dablanc)">🏗️ En Construcción</button>
                            <button type="button" class="option-btn p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-group="promocionando" data-value="Evento Inmobiliario">🗓️ Evento</button>
                        </div>
                    </div>
                </div>

                <!-- PASO 2: Canales y Formato -->
                <div class="step-content space-y-6 hidden" data-step="2">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Canales y Formato de Salida</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Plataformas de Difusión</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <button type="button" class="multi-btn p-3.5 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="LinkedIn">LinkedIn</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="WhatsApp">WhatsApp</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="Instagram">Instagram</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="Facebook">Facebook</button>
                            <button type="button" class="multi-btn p-3.5 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="Blog SEO">Blog SEO</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Estructura del Contenido</label>
                        <select id="formatoOutput" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 font-bold text-slate-700 transition-all cursor-pointer">
                            <option value="Pauta publicitaria">Pauta publicitaria (Ad Copy) [Exige Copy, Headline y Descripción]</option>
                            <option value="Post Orgánico">Post Orgánico [Educativo / Valor]</option>
                            <option value="Blog SEO">Artículo de Blog SEO [Estructura H1, H2, 200-500 palabras]</option>
                            <option value="Comunicación Interna">Comunicación Interna [Cultura Corporativa]</option>
                        </select>
                    </div>
                </div>

                <!-- PASO 3: Objetivo y Audiencia -->
                <div class="step-content space-y-6 hidden" data-step="3">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Estrategia y Audiencia</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Objetivo del Mensaje</label>
                        <select id="objetivo" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 font-bold text-slate-700 transition-all cursor-pointer">
                            <option value="Impulsar la inversión inmobiliaria y plusvalía.">Impulsar Inversión y Plusvalía</option>
                            <option value="Educar al usuario y generar confianza.">Educación Inmobiliaria</option>
                            <option value="Generar leads cualificados para ventas.">Captación de Leads</option>
                            <option value="Mostrar la cultura organizacional y liderazgo.">Posicionamiento Corporativo</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Público Objetivo</label>
                        <textarea id="audiencia" rows="2" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: Inversionistas buscando Airbnb, ejecutivos AAA..."></textarea>
                    </div>
                </div>

                <!-- PASO 4: Ángulo Libre y Restricciones -->
                <div class="step-content space-y-6 hidden" data-step="4">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Toque Final</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Puntos clave a destacar (Beneficio extra, promoción temporal)</label>
                        <textarea id="painPoints" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: Mencionar el crédito directo sin intereses, o la cercanía a colegios..."></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Palabras PROHIBIDAS (Aparte de los clichés de marca)</label>
                        <textarea id="palabrasNegativas" rows="2" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: barato, descuentos, competencia..."></textarea>
                    </div>
                </div>

            </form>

            <div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-200">
                <button type="button" id="prevBtn" class="px-6 py-3.5 rounded-2xl border-2 border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-50 hidden transition-all">Atrás</button>
                <button type="button" id="nextBtn" class="ml-auto px-8 py-3.5 rounded-2xl bg-slate-900 text-white font-bold text-sm hover:bg-black shadow-lg shadow-slate-300 transition-all flex items-center gap-2">
                    <span>Siguiente</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 sm:p-10 hidden transition-all duration-300">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-2xl font-black text-slate-900 tracking-tight">Instrucción Maestra Lista</h3>
                    <p class="text-sm text-slate-500 mt-0.5 font-medium">Copia y pega este prompt en tu herramienta de IA.</p>
                </div>
            </div>
            
            <textarea id="resultPrompt" rows="16" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-mono text-sm text-slate-700 mb-6 focus:outline-none custom-scrollbar" readonly></textarea>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button type="button" id="copyBtn" class="sm:col-span-2 py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm hover:bg-black transition-all shadow-lg shadow-slate-300 flex items-center justify-center gap-2">
                    <span>📋 Copiar Prompt</span>
                </button>
                <button type="button" id="backToEditBtn" class="sm:col-span-1 py-4 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl font-bold text-sm hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                    <span>✏️ Volver a editar</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        let currentStep = 1;
        const totalSteps = 4;
        const formData = { promocionando: 'Empresa (Corporativo)' };

        const stepTitles = [
            "Paso 1: Contexto de Proyecto",
            "Paso 2: Canales y Formato",
            "Paso 3: Estrategia y Audiencia",
            "Paso 4: Toque Final"
        ];

        document.getElementById('homeBtn').addEventListener('click', () => location.reload());

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.dataset.group;
                document.querySelectorAll(`[data-group="${group}"]`).forEach(b => {
                    b.classList.remove('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                    b.classList.add('border-slate-200', 'text-slate-500');
                });
                btn.classList.remove('border-slate-200', 'text-slate-500');
                btn.classList.add('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                formData[group] = btn.dataset.value;
            });
        });

        document.querySelectorAll('.multi-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('border-slate-900');
                btn.classList.toggle('bg-slate-50');
                btn.classList.toggle('text-slate-900');
                btn.classList.toggle('active-multi');
                btn.classList.toggle('border-slate-200');
                btn.classList.toggle('text-slate-500');
            });
        });

        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        function updateSteps() {
            document.querySelectorAll('.step-content').forEach(el => {
                el.classList.toggle('hidden', parseInt(el.dataset.step) !== currentStep);
            });

            for (let i = 1; i <= totalSteps; i++) {
                const indicator = document.getElementById(`step-indicator-${i}`);
                if (i <= currentStep) {
                    indicator.classList.remove('bg-slate-100', 'text-slate-400');
                    indicator.classList.add('bg-slate-900', 'text-white', 'shadow-md');
                } else {
                    indicator.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
                    indicator.classList.add('bg-slate-100', 'text-slate-400');
                }
            }

            document.getElementById('step-title-indicator').textContent = stepTitles[currentStep - 1];
            document.getElementById('step-percentage').textContent = `${Math.round((currentStep / totalSteps) * 100)}% Completado`;

            prevBtn.classList.toggle('hidden', currentStep === 1);
            
            if (currentStep === totalSteps) {
                nextBtn.innerHTML = `<span>Generar Prompt</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>`;
            } else {
                nextBtn.innerHTML = `<span>Siguiente</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>`;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateSteps();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                buildAndShowPrompt();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                updateSteps();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        function buildAndShowPrompt() {
            const plataformas = Array.from(document.querySelectorAll('.active-multi')).map(b => b.textContent.trim()).join(', ') || 'General';
            const formato = document.getElementById('formatoOutput').value;
            const objetivo = document.getElementById('objetivo').value;
            const audiencia = document.getElementById('audiencia').value || 'Público corporativo e inversionistas';
            const painPoints = document.getElementById('painPoints').value || 'Ninguno especificado adicionalmente.';
            const palabrasNegativasAdicionales = document.getElementById('palabrasNegativas').value || 'Ninguna extra';

            // REGLAS ESPECÍFICAS DE PROYECTO INYECTADAS
            let reglasProyecto = "";
            if (formData.promocionando === "Pixel") {
                reglasProyecto = "\n- ENFOQUE PIXEL: No vendas departamentos. Vende inversión. Comunica: La Magdalena, el Metro, 17 minutos al centro financiero, plan urbano, renta temporal y financiamiento directo.";
            } else if (formData.promocionando === "Magnus") {
                reglasProyecto = "\n- ENFOQUE MAGNUS: Vende: La Carolina, el edificio más alto, vista increíble, inversión premium y amenidades AAA.";
            } else if (formData.promocionando === "Imagine") {
                reglasProyecto = "\n- ENFOQUE IMAGINE: Enfatiza la ubicación en la González Suárez, exclusividad, el edificio ya terminado y calidad de vida.";
            } else if (formData.promocionando === "Proyectos en Desarrollo (Smart, Rubik, Musk, Dablanc)") {
                reglasProyecto = "\n- ENFOQUE PROYECTOS EN OBRA: Muestra avance, progreso constructivo, arquitectura y planificación. PROHIBIDO mencionar retrasos o fases de riesgo.";
            }

            let reglasCanal = "";
            if (plataformas.includes("Instagram")) reglasCanal += "\n- INSTAGRAM: Hook, Desarrollo, Valor, CTA corto. Máximo 2 párrafos largos.";
            if (plataformas.includes("LinkedIn")) reglasCanal += "\n- LINKEDIN: Tono corporativo, hablar de procesos e innovación. NADA comercial.";
            if (plataformas.includes("WhatsApp")) reglasCanal += "\n- WHATSAPP: Muy corto, conversacional y directo.";
            
            let formatoExtendido = formato === "Pauta publicitaria" 
                ? "\n- FORMATO DE SALIDA: Genera 3 OPCIONES DIFERENTES. Cada una debe tener: [1] Copy, [2] Headline y [3] Descripción."
                : (formato === "Blog SEO" ? "\n- FORMATO BLOG SEO: 200 a 500 palabras, H1 con keyword principal, H2, párrafos cortos de 3 líneas y cierre corporativo sutil." : "");

            let masterPrompt = `Eres el Director Creativo y Estratega Inmobiliario de Alpha Builders en Ecuador. Crea un copy de altísima calidad basado en estas directrices absolutas:

1. FILOSOFÍA Y TONO:
- Vende estilo de vida, inversión inteligente y plusvalía (nunca ladrillos).
- Tono: Profesional, elegante, premium, humano. 
- PROHIBIDO USAR: "Somos los mejores", "La mejor constructora", "garantizamos", "100%", "perfecto", "seguro". 

2. CONTEXTO DE ESTA PIEZA:
- Campaña / Proyecto: ${formData.promocionando}${reglasProyecto}
- Objetivo: ${objetivo}
- Audiencia: ${audiencia}
- Detalles clave a resaltar: ${painPoints}
- Palabras bloqueadas adicionales: ${palabrasNegativasAdicionales}

3. PLATAFORMAS Y FORMATO:
- Canales: ${plataformas}${reglasCanal}${formatoExtendido}
- CTA: Terminar siempre con un Call To Action claro pero no agresivo.`;

            document.getElementById('resultPrompt').value = masterPrompt;
            document.getElementById('wizardContainer').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('hidden');
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const copyText = document.getElementById('resultPrompt');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>✅ ¡Prompt copiado!</span>';
            btn.classList.remove('bg-slate-900', 'hover:bg-black');
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.add('bg-slate-900', 'hover:bg-black');
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
            }, 2500);
        });

        document.getElementById('backToEditBtn').addEventListener('click', () => {
            document.getElementById('outputContainer').classList.add('hidden');
            document.getElementById('wizardContainer').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
