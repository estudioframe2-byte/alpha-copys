<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Copywriter - Alpha Builders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .active-opt { border-color: #0f172a !important; background-color: #f8fafc !important; color: #0f172a !important; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important; }
        .active-multi { border-color: #0f172a !important; background-color: #f8fafc !important; color: #0f172a !important; }
        .slide-down { animation: slideDown 0.3s ease-out forwards; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-white via-slate-50 to-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white">

    <!-- Header Corporativo -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 py-6 text-center shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <div id="homeBtn" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" title="Volver al inicio para nueva campaña">
                <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-xl shadow-md">AB</div>
                <div class="text-left">
                    <h1 class="text-lg font-black text-slate-900 leading-tight tracking-tight">Alpha Builders</h1>
                    <p class="text-xs text-slate-500 font-bold tracking-widest uppercase mt-0.5">Asistente Copywriter</p>
                </div>
            </div>
            <span class="text-xs px-3 py-1 bg-slate-100 text-slate-600 font-bold rounded-full border border-slate-200 hidden sm:inline-block tracking-wide">COSTO $0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto w-full px-4 py-8 my-auto">
        
        <!-- Wizard Card -->
        <div id="wizardContainer" class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 sm:p-10 transition-all duration-300">
            
            <div class="mb-8">
                <div class="flex justify-between items-center mb-3">
                    <span id="step-title-indicator" class="text-xs font-black uppercase tracking-wider text-slate-900">Paso 1 de 5</span>
                    <span id="step-percentage" class="text-xs font-bold text-slate-400">20% Completado</span>
                </div>
                <div class="flex justify-between items-center relative">
                    <div class="absolute left-0 right-0 top-1/2 transform -translate-y-1/2 h-1.5 bg-slate-100 rounded-full z-0"></div>
                    <div id="step-indicator-1" class="w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-sm z-10 relative shadow-md transition-all">1</div>
                    <div id="step-indicator-2" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">2</div>
                    <div id="step-indicator-3" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">3</div>
                    <div id="step-indicator-4" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">4</div>
                    <div id="step-indicator-5" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm z-10 relative transition-all">5</div>
                </div>
            </div>

            <form id="promptForm" class="space-y-6">

                <!-- PASO 1: Contexto de la Campaña -->
                <div class="step-content space-y-6" data-step="1">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Contexto de la Campaña</h2>
                    </div>
                    
                    <!-- Selección Principal -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">¿Qué estamos promocionando?</label>
                        <div class="grid grid-cols-3 gap-3">
                            <button type="button" class="btn-categoria p-4 border-2 rounded-2xl text-center font-bold text-sm transition-all border-slate-900 bg-slate-50 text-slate-900 active-opt" data-value="Empresa">🏢 Empresa</button>
                            <button type="button" class="btn-categoria p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="Producto">📦 Producto</button>
                            <button type="button" class="btn-categoria p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="Evento">🗓️ Evento</button>
                        </div>
                    </div>

                    <!-- Submenú Dinámico para Producto (Oculto por defecto) -->
                    <div id="submenu-producto" class="hidden slide-down bg-slate-50 border border-slate-200 rounded-2xl p-5">
                        <label class="block text-sm font-bold text-slate-700 mb-3">Selecciona el Proyecto Inmobiliario:</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button type="button" class="btn-proyecto p-3 border-2 border-slate-900 bg-white text-slate-900 rounded-xl text-center font-bold text-xs transition-all active-opt" data-value="Pixel">Pixel</button>
                            <button type="button" class="btn-proyecto p-3 border-2 border-slate-200 bg-white text-slate-500 rounded-xl text-center font-bold text-xs transition-all hover:border-slate-300" data-value="Magnus">Magnus</button>
                            <button type="button" class="btn-proyecto p-3 border-2 border-slate-200 bg-white text-slate-500 rounded-xl text-center font-bold text-xs transition-all hover:border-slate-300" data-value="Imagine">Imagine</button>
                            <button type="button" class="btn-proyecto p-3 border-2 border-slate-200 bg-white text-slate-500 rounded-xl text-center font-bold text-xs transition-all hover:border-slate-300" data-value="Proyectos en Desarrollo">En Construcción</button>
                        </div>
                    </div>

                    <!-- Región -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Región de Enfoque</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <button type="button" class="btn-region p-4 border-2 rounded-2xl text-left sm:text-center transition-all border-slate-900 bg-slate-50 text-slate-900 active-opt" data-value="Norte de Quito (República)">
                                <div class="font-bold text-sm">Norte (Quito)</div>
                                <div class="text-xs mt-0.5 opacity-80">Ejecutivo / AAA</div>
                            </button>
                            <button type="button" class="btn-region p-4 border-2 border-slate-200 rounded-2xl text-left sm:text-center transition-all hover:border-slate-300 text-slate-500" data-value="Sur de Quito (La Magdalena)">
                                <div class="font-bold text-sm">Sur (Quito)</div>
                                <div class="text-xs mt-0.5">Tradicional</div>
                            </button>
                            <button type="button" class="btn-region p-4 border-2 border-slate-200 rounded-2xl text-left sm:text-center transition-all hover:border-slate-300 text-slate-500" data-value="Medellín">
                                <div class="font-bold text-sm">Medellín</div>
                                <div class="text-xs mt-0.5">Comercial</div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- PASO 2: Canales y Formato -->
                <div class="step-content space-y-6 hidden" data-step="2">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Canales y Formato de Salida</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Plataformas de Difusión (Selección múltiple)</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <button type="button" class="multi-btn p-3.5 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="LinkedIn">LinkedIn</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="WhatsApp">WhatsApp</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="Instagram">Instagram</button>
                            <button type="button" class="multi-btn p-3.5 border-2 rounded-2xl text-center font-bold text-sm transition-all active-multi" data-value="Facebook">Facebook</button>
                            <button type="button" class="multi-btn p-3.5 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="TikTok">TikTok</button>
                            <button type="button" class="multi-btn p-3.5 border-2 border-slate-200 rounded-2xl text-center font-bold text-sm transition-all hover:border-slate-300 text-slate-500" data-value="Blog SEO">Blog SEO</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Estructura del Contenido</label>
                        <select id="formatoOutput" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 font-bold text-slate-700 transition-all cursor-pointer">
                            <option value="Pauta publicitaria">Pauta publicitaria (Ad Copy) [Exige Copy, Headline y Descripción]</option>
                            <option value="Post Orgánico">Post Orgánico [Educativo / Valor]</option>
                            <option value="Blog SEO">Artículo de Blog SEO [Estructura H1, H2, 200-500 palabras]</option>
                            <option value="Comunicación Interna">Comunicación Interna [Cultura Corporativa]</option>
                        </select>
                    </div>
                </div>

                <!-- PASO 3: Objetivo y Audiencia -->
                <div class="step-content space-y-6 hidden" data-step="3">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Estrategia Inmobiliaria</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Objetivo del Mensaje</label>
                        <select id="objetivo" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 font-bold text-slate-700 transition-all cursor-pointer">
                            <option value="Impulsar la inversión inmobiliaria, crecimiento patrimonial y plusvalía.">Impulsar Inversión y Plusvalía</option>
                            <option value="Educar al usuario y generar confianza mediante evidencia visual y procesos.">Educación Inmobiliaria</option>
                            <option value="Generar leads cualificados para el equipo comercial.">Captación de Leads</option>
                            <option value="Mostrar la cultura organizacional, liderazgo e innovación.">Posicionamiento Corporativo</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Audiencia Meta</label>
                        <textarea id="audiencia" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: Profesionales jóvenes interesados en su primera inversión, segmento exclusivo AAA, etc."></textarea>
                    </div>
                </div>

                <!-- PASO 4: Mensaje y Pain Points -->
                <div class="step-content space-y-6 hidden" data-step="4">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Ángulo Creativo</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">¿Qué vamos a destacar en específico?</label>
                        <textarea id="painPoints" rows="5" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: Financiamiento directo sin intereses, cercanía a transporte, diseño interior..."></textarea>
                    </div>
                </div>

                <!-- PASO 5: Reglas Estrictas -->
                <div class="step-content space-y-6 hidden" data-step="5">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Filtros Adicionales</h2>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Palabras Adicionales a Evitar</label>
                        <textarea id="palabrasNegativas" rows="4" class="w-full p-4 border-2 border-slate-200 rounded-2xl focus:border-slate-900 focus:outline-none bg-slate-50 text-slate-700 font-medium transition-all placeholder:text-slate-400" placeholder="Ej: barato, inversiones milagrosas, retrasos de obra..."></textarea>
                    </div>
                </div>

            </form>

            <div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-200">
                <button type="button" id="prevBtn" class="px-6 py-3.5 rounded-2xl border-2 border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-50 hidden transition-all">Atrás</button>
                <button type="button" id="nextBtn" class="ml-auto px-8 py-3.5 rounded-2xl bg-slate-900 text-white font-bold text-sm hover:bg-black shadow-lg shadow-slate-300 transition-all flex items-center gap-2">
                    <span>Siguiente</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 sm:p-10 hidden transition-all duration-300">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-2xl font-black text-slate-900 tracking-tight">Instrucción Maestra Generada</h3>
                    <p class="text-sm text-slate-500 mt-0.5 font-medium">Copia y pega este texto en tu IA.</p>
                </div>
            </div>
            
            <textarea id="resultPrompt" rows="18" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-mono text-sm text-slate-700 mb-6 focus:outline-none custom-scrollbar" readonly></textarea>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button type="button" id="copyBtn" class="sm:col-span-2 py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm hover:bg-black transition-all shadow-lg shadow-slate-300 flex items-center justify-center gap-2">
                    <span>📋 Copiar Instrucción</span>
                </button>
                <button type="button" id="backToEditBtn" class="sm:col-span-1 py-4 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl font-bold text-sm hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                    <span>✏️ Volver a editar</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        let currentStep = 1;
        const totalSteps = 5;
        
        // Estado inicial
        const formData = {
            categoria: 'Empresa',
            proyecto: 'Pixel', // Valor por defecto en caso de abrir submenú
            region: 'Norte de Quito (República)'
        };

        const stepTitles = [
            "Paso 1: Contexto de la Campaña",
            "Paso 2: Canales y Formato",
            "Paso 3: Estrategia Inmobiliaria",
            "Paso 4: Ángulo Creativo",
            "Paso 5: Filtros Adicionales"
        ];

        document.getElementById('homeBtn').addEventListener('click', () => {
            location.reload();
        });

        // LÓGICA CATEGORÍA PRINCIPAL (Empresa, Producto, Evento)
        document.querySelectorAll('.btn-categoria').forEach(btn => {
            btn.addEventListener('click', () => {
                // Actualizar UI botones categoría
                document.querySelectorAll('.btn-categoria').forEach(b => {
                    b.classList.remove('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                    b.classList.add('border-slate-200', 'text-slate-500');
                });
                btn.classList.remove('border-slate-200', 'text-slate-500');
                btn.classList.add('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                
                formData.categoria = btn.dataset.value;

                // Lógica de visualización del Submenú
                const submenu = document.getElementById('submenu-producto');
                if (formData.categoria === 'Producto') {
                    submenu.classList.remove('hidden');
                } else {
                    submenu.classList.add('hidden');
                }
            });
        });

        // LÓGICA SUBMENÚ PROYECTO
        document.querySelectorAll('.btn-proyecto').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-proyecto').forEach(b => {
                    b.classList.remove('border-slate-900', 'text-slate-900', 'active-opt');
                    b.classList.add('border-slate-200', 'text-slate-500');
                });
                btn.classList.remove('border-slate-200', 'text-slate-500');
                btn.classList.add('border-slate-900', 'text-slate-900', 'active-opt');
                formData.proyecto = btn.dataset.value;
            });
        });

        // LÓGICA REGIÓN
        document.querySelectorAll('.btn-region').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-region').forEach(b => {
                    b.classList.remove('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                    b.classList.add('border-slate-200', 'text-slate-500');
                });
                btn.classList.remove('border-slate-200', 'text-slate-500');
                btn.classList.add('border-slate-900', 'bg-slate-50', 'text-slate-900', 'active-opt');
                formData.region = btn.dataset.value;
            });
        });

        // LÓGICA SELECCIÓN MÚLTIPLE (Redes sociales)
        document.querySelectorAll('.multi-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('border-slate-900');
                btn.classList.toggle('bg-slate-50');
                btn.classList.toggle('text-slate-900');
                btn.classList.toggle('active-multi');
                btn.classList.toggle('border-slate-200');
                btn.classList.toggle('text-slate-500');
            });
        });

        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        function updateSteps() {
            document.querySelectorAll('.step-content').forEach(el => {
                el.classList.toggle('hidden', parseInt(el.dataset.step) !== currentStep);
            });

            for (let i = 1; i <= totalSteps; i++) {
                const indicator = document.getElementById(`step-indicator-${i}`);
                if (i <= currentStep) {
                    indicator.classList.remove('bg-slate-100', 'text-slate-400');
                    indicator.classList.add('bg-slate-900', 'text-white', 'shadow-md');
                } else {
                    indicator.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
                    indicator.classList.add('bg-slate-100', 'text-slate-400');
                }
            }

            document.getElementById('step-title-indicator').textContent = stepTitles[currentStep - 1];
            document.getElementById('step-percentage').textContent = `${Math.round((currentStep / totalSteps) * 100)}% Completado`;

            prevBtn.classList.toggle('hidden', currentStep === 1);
            
            if (currentStep === totalSteps) {
                nextBtn.innerHTML = `<span>Generar Prompt</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>`;
            } else {
                nextBtn.innerHTML = `<span>Siguiente</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>`;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateSteps();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                buildAndShowPrompt();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                updateSteps();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        function buildAndShowPrompt() {
            const plataformas = Array.from(document.querySelectorAll('.active-multi')).map(b => b.textContent.trim()).join(', ') || 'General';
            const formato = document.getElementById('formatoOutput').value;
            const objetivo = document.getElementById('objetivo').value;
            const audiencia = document.getElementById('audiencia').value || 'Público corporativo e inversionistas';
            const painPoints = document.getElementById('painPoints').value || 'Desarrollo urbano y crecimiento patrimonial';
            const palabrasNegativasAdicionales = document.getElementById('palabrasNegativas').value || 'Ninguna adicional';

            // REGLAS ESPECÍFICAS DE PROYECTO (Solo se inyectan si se seleccionó "Producto")
            let reglasProyecto = "";
            let enfoquePromocion = formData.categoria;

            if (formData.categoria === "Producto") {
                enfoquePromocion = `Proyecto: ${formData.proyecto}`;
                if (formData.proyecto === "Pixel") {
                    reglasProyecto = "\n- ESTRATEGIA PIXEL: No vendas departamentos. Vende inversión. Comunica: La Magdalena, el Metro, 17 minutos al centro financiero, plan urbano, renta temporal y plusvalía.";
                } else if (formData.proyecto === "Magnus") {
                    reglasProyecto = "\n- ESTRATEGIA MAGNUS: Vende: La Carolina, el edificio más alto, últimas unidades, vista espectacular, inversión premium y amenities.";
                } else if (formData.proyecto === "Imagine") {
                    reglasProyecto = "\n- ESTRATEGIA IMAGINE: Enfatiza la ubicación en la González Suárez, exclusividad, el edificio terminado, amenities y calidad de vida.";
                } else if (formData.proyecto === "Proyectos en Desarrollo") {
                    reglasProyecto = "\n- ESTRATEGIA PROYECTOS EN OBRA: Muestra avance, progreso constructivo, arquitectura y planificación. PROHIBIDO mencionar retrasos o hablar de fases si existe riesgo reputacional.";
                }
            }

            let reglasCanal = "";
            if (plataformas.includes("Instagram")) reglasCanal += "\n   - Instagram: Debe incluir Hook, Desarrollo, Valor, CTA corto y Hashtags. Nunca más de dos párrafos largos.";
            if (plataformas.includes("LinkedIn")) reglasCanal += "\n   - LinkedIn: Tono estrictamente institucional. Hablar de procesos, equipos, innovación y cultura. Cero tono comercial.";
            if (plataformas.includes("WhatsApp")) reglasCanal += "\n   - WhatsApp: Muy corto, directo, conversacional y con emojis medidos.";
            
            let formatoExtendido = "";
            if (formato === "Pauta publicitaria") {
                formatoExtendido = "\n- FORMATO REQUERIDO (PAUTA): Tienes que entregar exactamente 3 OPCIONES DIFERENTES. Cada opción debe contener explícitamente: [1] Copy principal, [2] Headline (Título corto) y [3] Descripción.";
            } else if (formato === "Blog SEO" || plataformas.includes("Blog SEO")) {
                formatoExtendido = `\n- FORMATO REQUERIDO (BLOG SEO):
   - Extensión: 200 a 500 palabras.

   - Cierre: Párrafo institucional sobre Alpha Builders (compromiso con innovación, calidad, etc.) sin sonar comercial.`;
            }

            let masterPrompt = `Eres un Director Creativo, Copywriter Senior y Estratega de Marketing Inmobiliario de la empresa Alpha Builders, especializado en la industria inmobiliaria de Ecuador. Tu objetivo fundamental es educar, generar confianza y posicionar la marca.

            document.getElementById('resultPrompt').value = masterPrompt;
            document.getElementById('wizardContainer').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('hidden');
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const copyText = document.getElementById('resultPrompt');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>✅ ¡Copiado con éxito!</span>';
            btn.classList.remove('bg-slate-900', 'hover:bg-black');
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.add('bg-slate-900', 'hover:bg-black');
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
            }, 2500);
        });

        document.getElementById('backToEditBtn').addEventListener('click', () => {
            document.getElementById('outputContainer').classList.add('hidden');
            document.getElementById('wizardContainer').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
